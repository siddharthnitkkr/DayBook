<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Daybook</title>
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#06100b">
  <!-- Only this folder's scripts, plus Leaflet from the jsDelivr CDN (the map), may run. Map tiles come from OpenStreetMap and place search from its free Nominatim service, nothing else. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https://tile.openstreetmap.org; media-src 'self' blob:; connect-src https://nominatim.openstreetmap.org; object-src 'none'; base-uri 'none'; form-action 'none'">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Manrope:wght@400;500;600;650;700;750;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

  <link rel="stylesheet" href="css/tokens.css?v=65">
  <link rel="stylesheet" href="css/base.css?v=65">
  <link rel="stylesheet" href="css/layout.css?v=65">
  <link rel="stylesheet" href="css/components.css?v=65">
  <link rel="stylesheet" href="css/glass.css?v=65">
  <link rel="stylesheet" href="css/paper.css?v=65">
  <link rel="stylesheet" href="css/dragon.css?v=65">
  <link rel="stylesheet" href="css/pages.css?v=65">
  <link rel="stylesheet" href="css/places.css?v=65">
  <link rel="stylesheet" href="css/notes.css?v=65">
  <link rel="stylesheet" href="css/effects.css?v=65">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- The forest and the dragon: full-screen video, built by dragon.js. Decorative, so hidden from assistive tech. -->
  <div class="world" id="world" aria-hidden="true"></div>


  <!-- Fireflies and mist over the world, under the glass -->
  <div class="fx" aria-hidden="true">
    <div class="mist"></div>
    <canvas id="fireflies"></canvas>
  </div>

  <!-- Dragon power, sound, speech -->
  <div class="hud" id="hud" role="region" aria-label="Dragon companion"></div>

  <div class="shell" id="app">
    <nav class="rail glass" id="rail" aria-label="Main">
      <a class="rail__brand" href="#/today" aria-label="Daybook, go to Today">
        <svg class="rail__mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".55"/>
          <path d="M16 26c-6-3.500-8-9.500-4-16 1.500 3 4.500 4.500 4 9 2-1.500 4-4.500 3.500-9 4 4 4.500 11.500-3.500 16z" fill="currentColor"/>
        </svg>
      </a>
      <ul class="rail__list" id="rail-list"></ul>
    </nav>

    <section class="diary glass" id="diary" data-sheet="half" aria-label="Your diary">
      <span class="diary__binding" aria-hidden="true"></span>
      <button class="sheet-handle" id="sheet-handle" type="button" aria-label="Resize the diary sheet"><span></span></button>
      <div class="peek" id="peek"></div>
      <main id="main" tabindex="-1">
        <div id="banner"></div>
        <div id="view"></div>
      </main>
    </section>

    <nav class="tabbar glass" id="tabbar" aria-label="Main"></nav>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">Daybook needs JavaScript. It runs entirely in your browser and sends nothing anywhere.</p></noscript>

  <script src="js/util.js?v=65"></script>
  <script src="js/dragon-config.js?v=65"></script>
  <script src="js/store.js?v=65"></script>
  <script src="js/progress.js?v=65"></script>
  <script src="assets/dragon-video/idle-manifest.js?v=65"></script>
  <script src="js/idle-library.js?v=65"></script>
  <script src="js/router.js?v=65"></script>
  <script src="js/dragon.js?v=65"></script>
  <script src="js/fireflies.js?v=65"></script>
  <script src="js/today.js?v=65"></script>
  <script src="js/photos.js?v=65"></script>
  <script src="js/voice.js?v=65"></script>
  <script src="js/maplink.js?v=65"></script>
  <script src="js/habits.js?v=65"></script>
  <script src="js/likes.js?v=65"></script>
  <script src="js/bucket.js?v=65"></script>
  <script src="js/notes.js?v=65"></script>
  <script src="js/alerts.js?v=65"></script>
  <script src="js/reminders.js?v=65"></script>
  <script src="js/insights.js?v=65"></script>
  <script src="js/prompt.js?v=65"></script>
  <script src="js/settings.js?v=65"></script>
  <script src="js/intro.js?v=65"></script>
  <script src="js/main.js?v=65"></script>
</body>
</html>
